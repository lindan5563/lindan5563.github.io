<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lindan5563 · 引导主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Inter", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            background: #0b1a2f; /* 深色底色，背景图加载前/半透明时更优雅 */
            background-image: url('https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 1.5rem;
            position: relative;
        }

        /* 柔光遮罩，提升文字可读性，也让背景更柔和 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 120, 212, 0.15), transparent 70%),
                        linear-gradient(135deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%);
            pointer-events: none;
            z-index: 0;
            backdrop-filter: blur(2px);
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            padding: 3rem 2.5rem;
            border-radius: 42px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                        0 0 40px rgba(0, 120, 212, 0.2);
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .container:hover {
            transform: scale(1.01);
            box-shadow: 0 32px 60px -12px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                        0 0 60px rgba(0, 120, 212, 0.3);
        }

        h1 {
            color: #0a1e33;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.6);
            background: linear-gradient(135deg, #0b2b4a, #1b4c7c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #1e3b5a;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            font-weight: 450;
            line-height: 1.7;
            margin-bottom: 1rem;
            padding: 0 0.25rem;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.5);
        }

        .subtitle:last-of-type {
            margin-bottom: 2.25rem;
        }

        /* 链接是内联文本，特殊处理——不影响按钮样式 */
        .subtitle a {
            display: inline;
            color: #0078d4;
            background: rgba(255, 255, 255, 0.7);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 120, 212, 0.2);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 0.95em;
            margin: 0 2px;
        }

        .subtitle a:hover {
            background: #0078d4;
            color: #ffffff;
            border-color: #0078d4;
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
            transform: translateY(-1px);
        }

        /* 主按钮 */
        .btn-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            background: linear-gradient(145deg, #0078d4, #005a9e);
            padding: 1rem 2.8rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 1.2rem);
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            box-shadow: 0 10px 25px -8px rgba(0, 120, 212, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-top: 0.75rem;
        }

        .btn-main::after {
            content: "→";
            font-size: 1.2em;
            font-weight: 400;
            opacity: 0.9;
            transition: transform 0.2s ease;
        }

        .btn-main:hover {
            background: linear-gradient(145deg, #0088e8, #0068b0);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 35px -10px rgba(0, 120, 212, 0.7),
                        0 0 0 2px rgba(255, 255, 255, 0.5) inset;
        }

        .btn-main:hover::after {
            transform: translateX(5px);
        }

        .btn-main:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 10px 20px -5px rgba(0, 120, 212, 0.6);
        }

        /* 装饰元素：小圆点微光 */
        .container::before,
        .container::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 120, 212, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .container::before {
            width: 200px;
            height: 200px;
            top: -40px;
            left: -40px;
        }

        .container::after {
            width: 250px;
            height: 250px;
            bottom: -60px;
            right: -50px;
        }

        /* 移动端紧凑优化 */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 2.2rem 1.5rem;
                border-radius: 32px;
            }

            .subtitle {
                line-height: 1.6;
                font-size: 0.95rem;
            }

            .btn-main {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }

            .subtitle a {
                white-space: normal;
                display: inline-block;
                margin: 2px 0;
            }
        }

        /* 为文字增加轻薄的层次 */
        h1, .subtitle {
            position: relative;
            z-index: 1;
        }

        /* 平滑字体渲染 */
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 确保背景图覆盖且平滑 */
        body {
            background-color: #0f1a2b;
        }

        /* 减弱背景图模糊时的伪影 */
        img, a {
            -webkit-tap-highlight-color: transparent;
        }

        /* 可选：给卡片增加一点细腻的光晕 */
        .container {
            transition: transform 0.3s ease, box-shadow 0.4s ease, background 0.3s ease;
        }

        /* 按钮获得焦点时的可访问性 */
        .btn-main:focus-visible {
            outline: 3px solid #99c9ff;
            outline-offset: 4px;
        }

        .subtitle a:focus-visible {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }
    </style>
</head>

        <a class="btn-main" href="https://luogu-blog.lby5563.workers.dev" target="_blank" rel="noopener">点击跳转</a>
    </div>

</body>
</html>
