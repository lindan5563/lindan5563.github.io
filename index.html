<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lindan5563引导主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        .container {
            width: 1000px;
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.85); /* 85% 不透明的白色 */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); /* 添加阴影增加立体感 */
            text-align: center;
            backdrop-filter: blur(4px); /* 可选：毛玻璃效果，提升质感 */
        }

        h1 {
            color: #333;
            margin-bottom: 16px;
            font-size: 2em;
        }
        .subtitle {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            color: #fff;
            background-color: #0078d4; /* 微软蓝 */
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        a:hover {
            background-color: #005a9e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>欢迎来到 lindan5563 的主页！</h1>
        <p class="subtitle">由于 Github Pages 功能太弱，已将主页迁移至 Cloud Flare Workers Free</p>
        <a href="https://luogu-blog.lby5563.workers.dev">点击跳转</a>
    </div>

</body>
</html>
