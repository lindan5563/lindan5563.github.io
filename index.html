<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lindan5563引导主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        .container {
            width: 1000px;
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        h1 {
            color: #333;
            margin-bottom: 16px;
            font-size: 2em;
        }
        .subtitle {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* 通用链接样式（保留给主按钮及其他可能的链接） */
        a {
            display: inline-block;
            color: #fff;
            background-color: #0078d4;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        a:hover {
            background-color: #005a9e;
            transform: translateY(-2px);
        }

        /* --- 新增：astar vpn 按钮样式（小号、内联、胶囊状）--- */
        .vpn-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
            background: linear-gradient(145deg, #0078d4, #005a9e);
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px -4px rgba(0, 120, 212, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            border: none;
            cursor: pointer;
            margin: 0 4px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .vpn-btn::after {
            content: "→";
            font-size: 1em;
            font-weight: 400;
            opacity: 0.9;
            transition: transform 0.2s ease;
        }

        .vpn-btn:hover {
            background: linear-gradient(145deg, #0088e8, #0068b0);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 18px -6px rgba(0, 120, 212, 0.7),
                        0 0 0 2px rgba(255, 255, 255, 0.4) inset;
        }

        .vpn-btn:hover::after {
            transform: translateX(3px);
        }

        .vpn-btn:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 4px 10px -3px rgba(0, 120, 212, 0.6);
        }

        .vpn-btn:focus-visible {
            outline: 3px solid #99c9ff;
            outline-offset: 3px;
        }

        /* 确保段落内按钮不破坏行高 */
        .subtitle .vpn-btn {
            line-height: 1.4;
        }

        /* 小屏幕适配 */
        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
            }
            .subtitle {
                font-size: 1em;
            }
            .vpn-btn {
                padding: 6px 16px;
                font-size: 0.85em;
                margin: 4px 2px;
            }
            a {
                padding: 10px 24px;
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>欢迎来到 lindan5563 的主页！</h1>
